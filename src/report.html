<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Token Report</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --border: #21262d;
        --border2: #30363d;
        --text: #c9d1d9;
        --muted: #8b949e;
        --faint: #484f58;
        --blue: #58a6ff;
        --blue-bg: #1f3a5f;
        --blue-dim: #1f6feb;
        --green: #3fb950;
        --yellow: #d29922;
        --purple: #bc8cff;
        --red: #f85149;
        --orange: #e3b341;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
        font-size: 14px;
        padding: 14px 48px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* ── Sticky 图表区 ── */
      .sticky-chart {
        position: sticky;
        top: 0;
        z-index: 100;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 16px 8px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      }

      /* ── 维度控制条 ── */
      .dim-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 8px;
        flex-wrap: wrap;
      }
      .dim-label {
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.05em;
      }
      .dim-chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 9px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        border: 1px solid transparent;
        transition: opacity 0.15s;
        user-select: none;
      }
      .dim-chip .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: currentColor;
      }
      .dim-chip.input {
        background: #1f3a5f;
        color: var(--blue);
        border-color: #1f6feb55;
      }
      .dim-chip.output {
        background: #1a3a28;
        color: var(--green);
        border-color: #3fb95055;
      }
      .dim-chip.cache-r {
        background: #3a2a00;
        color: var(--yellow);
        border-color: #d2992255;
      }
      .dim-chip.cache-c {
        background: #2a1a3a;
        color: var(--purple);
        border-color: #bc8cff55;
      }
      .dim-chip.off {
        opacity: 0.3;
      }

      /* 会话栏 */
      .session-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
        flex-wrap: wrap;
        gap: 6px;
      }
      .session-select {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 4px 10px;
        color: var(--blue);
        font-size: 12px;
        cursor: pointer;
        font-family: inherit;
      }
      .session-meta {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .smeta {
        font-size: 12px;
      }
      .smeta-l {
        color: var(--muted);
      }
      .smeta-v.in {
        color: var(--blue);
        font-weight: 700;
      }
      .smeta-v.out {
        color: var(--green);
        font-weight: 700;
      }
      .smeta-v.cr {
        color: var(--yellow);
        font-weight: 700;
      }
      .smeta-v.cc {
        color: var(--purple);
        font-weight: 700;
      }

      /* 图表 */
      .chart-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 4px;
      }
      .chart-title-text {
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .range-label {
        font-size: 12px;
        color: var(--blue);
        background: var(--blue-bg);
        border: 1px solid #1f6feb44;
        border-radius: 4px;
        padding: 2px 8px;
      }

      /* 主图容器（固定宽度，不溢出） */
      .main-chart-scroll {
        overflow: hidden;
        position: relative;
      }

      #mainChart {
        width: 100%;
        height: 120px;
        display: block;
        cursor: grab;
      }
      #mainChart.dragging {
        cursor: grabbing;
      }

      /* Brush */
      .brush-wrap {
        margin-top: 6px;
        position: relative;
      }
      .brush-title {
        font-size: 12px;
        color: var(--faint);
        letter-spacing: 0.06em;
        margin-bottom: 3px;
      }
      #brushChart {
        width: 100%;
        height: 32px;
        display: block;
      }
      .brush-overlay {
        position: absolute;
        top: 16px;
        height: 32px;
        pointer-events: none;
      }
      .brush-selection {
        position: absolute;
        top: 0;
        height: 100%;
        background: rgba(88, 166, 255, 0.1);
        border-left: 1px solid var(--blue);
        border-right: 1px solid var(--blue);
      }
      .brush-handle {
        position: absolute;
        top: 50%;
        width: 5px;
        height: 18px;
        background: var(--blue);
        border-radius: 2px;
        cursor: ew-resize;
        pointer-events: all;
        z-index: 3;
        transform: translateY(-50%) translateX(-2px);
      }
      .brush-move-area {
        position: absolute;
        top: 0;
        height: 100%;
        cursor: grab;
        pointer-events: all;
        z-index: 2;
      }
      .brush-move-area:active {
        cursor: grabbing;
      }

      /* 图例 */
      .chart-legend {
        display: flex;
        gap: 10px;
        margin-top: 6px;
        flex-wrap: wrap;
      }
      .legend-item {
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .legend-dot {
        width: 7px;
        height: 7px;
        border-radius: 2px;
      }

      /* ── 对话内容区 ── */
      .conv-scroll {
        padding: 14px 16px 40px;
        flex: 1;
      }
      .section-label {
        font-size: 12px;
        color: var(--blue);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 10px;
        padding-bottom: 4px;
        border-bottom: 1px solid var(--border);
      }

      /* ── 普通 user/assistant 行 ── */

      [id^='turn-'] {
        margin-bottom: 12px;
      }
      .msg-user {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px 6px 0 6px;
        overflow: hidden;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      .msg-user.bar-hover {
        border-color: var(--blue);
        box-shadow:
          0 0 0 1px #58a6ff33,
          0 0 12px #58a6ff22;
      }
      .msg-user-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
      }
      .role-badge {
        font-size: 10px;
        font-weight: 700;
        padding: 2px 7px;
        border-radius: 3px;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .role-badge.user {
        background: #d2992222;
        color: var(--yellow);
        border: 1px solid #d2992244;
      }
      .role-badge.asst {
        background: #1f6feb22;
        color: var(--blue);
        border: 1px solid #1f6feb44;
      }
      /* ASSISTANT 主导（无 user 输入） */
      .msg-asst-led {
        background: #0d1117;
        border: 1px solid #1f6feb33;
        border-radius: 6px;
        overflow: hidden;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      .msg-asst-led.bar-hover {
        border-color: var(--blue);
        box-shadow:
          0 0 0 1px #58a6ff33,
          0 0 12px #58a6ff22;
      }
      .msg-asst-led .msg-user-header {
        background: #1f6feb0d;
      }
      .msg-time {
        font-size: 12px;
        color: var(--muted);
        flex-shrink: 0;
      }
      .msg-tokens {
        display: flex;
        gap: 8px;
        margin-left: auto;
        flex-shrink: 0;
        flex-wrap: wrap;
        font-size: 12px;
      }
      .tok .tl {
        color: var(--muted);
      }
      .tok.in .tv {
        color: var(--blue);
      }
      .tok.out .tv {
        color: var(--green);
      }
      .tok.cr .tv {
        color: var(--yellow);
      }
      .tok.cc .tv {
        color: var(--purple);
      }

      .msg-body {
        padding: 0 12px 8px;
      }
      .msg-text {
        color: var(--text);
        font-size: 12px;
        line-height: 1.65;
        font-family: -apple-system, 'Segoe UI', sans-serif;
        white-space: pre-wrap;
      }
      .msg-text.clamped {
        display: -webkit-box;
        -webkit-line-clamp: 6;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .expand-btn {
        display: inline-block;
        margin-top: 4px;
        font-size: 12px;
        color: var(--blue);
        cursor: pointer;
        border-bottom: 1px dashed #1f6feb55;
        font-family: inherit;
      }

      .msg-assistant {
        margin-left: 28px;
        margin-bottom: 6px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-left: 2px solid #1f6feb44;
        border-radius: 0 0 6px 6px;
        border-top: none;
        overflow: hidden;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      .msg-assistant.bar-hover {
        border-color: var(--blue);
        border-left-color: var(--blue);
        box-shadow: 0 0 0 1px #58a6ff33;
      }
      .msg-assistant-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 12px 6px;
      }
      .model-tag {
        font-size: 12px;
        color: var(--faint);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 1px 6px;
      }

      /* ── Compact 事件行 ── */
      .event-compact {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        margin-bottom: 10px;
        background: #1e0f2e;
        border: 1px solid #bc8cff55;
        border-left: 3px solid var(--purple);
        border-radius: 4px;
        font-size: 12px;
        box-shadow: 0 0 10px #bc8cff18;
        position: relative;
      }
      .event-compact::before {
        content: '⚡';
        font-size: 12px;
        filter: drop-shadow(0 0 4px var(--purple));
      }
      .event-compact .ev-label {
        color: var(--purple);
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-shadow: 0 0 6px #bc8cff88;
      }
      .event-compact .ev-detail {
        color: #d2b8ff;
        flex: 1;
      }
      .event-compact .ev-meta {
        color: #9070bf;
        font-size: 12px;
      }

      /* ── Branch 分支 ── */
      .branch-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        margin-bottom: 4px;
        background: #1a2a1a;
        border: 1px solid #3fb95033;
        border-radius: 5px 5px 0 0;
        font-size: 12px;
      }
      .branch-tag {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: #1a3a28;
        color: var(--green);
        border: 1px solid #3fb95055;
        border-radius: 3px;
        padding: 2px 8px;
        font-size: 12px;
        font-weight: 700;
      }
      .branch-tag .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--green);
      }
      .branch-dim-label {
        color: var(--muted);
        font-size: 12px;
      }
      .branch-body {
        border-left: 2px solid #3fb95044;
        margin-left: 10px;
        padding-left: 10px;
        margin-bottom: 10px;
      }

      /* sidechain 标记 */
      .sidechain-badge {
        font-size: 10px;
        font-weight: 700;
        background: #2a1a1a;
        color: var(--red);
        border: 1px solid #f8514944;
        border-radius: 3px;
        padding: 1px 5px;
        letter-spacing: 0.05em;
      }

      /* ── Thinking block ── */
      .thinking-block {
        margin: 4px 12px 6px;
        border: 1px solid #30363d;
        border-left: 2px solid #484f58;
        border-radius: 0 4px 4px 0;
        overflow: hidden;
      }
      .thinking-header {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        background: #161b22;
        cursor: pointer;
        user-select: none;
        font-size: 12px;
        color: var(--faint);
      }
      .thinking-header:hover {
        color: var(--muted);
      }
      .thinking-toggle {
        margin-left: auto;
        font-size: 12px;
      }
      .thinking-body {
        padding: 8px 10px;
        background: #0d1117;
        font-size: 12px;
        color: #6e7681;
        line-height: 1.6;
        font-family: -apple-system, 'Segoe UI', sans-serif;
        white-space: pre-wrap;
        display: none;
        max-height: 160px;
        overflow-y: auto;
      }
      .thinking-body.open {
        display: block;
      }

      /* ══════════════════════════════════════
   工具调用组
   ══════════════════════════════════════ */
      .tc-group {
        margin: 0 0 10px 28px;
        border-left: 2px solid var(--border2);
        padding-top: 6px;
        padding-left: 12px;
      }
      .tc-toggle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--faint);
        cursor: pointer;
        user-select: none;
        padding: 3px 0;
        margin-bottom: 6px;
        transition: color 0.15s;
      }
      .tc-toggle:hover {
        color: var(--muted);
      }
      .tc-toggle .arrow {
        font-size: 12px;
        transition: transform 0.15s;
        display: inline-block;
      }
      .tc-toggle.open .arrow {
        transform: rotate(90deg);
      }
      .tc-badge {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 1px 8px;
        font-size: 10px;
        color: var(--muted);
      }
      .tc-summary {
        font-size: 12px;
        color: var(--faint);
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      .tool-pills {
        display: inline-flex;
        gap: 3px;
        flex-wrap: wrap;
      }
      .tool-pill {
        font-size: 10px;
        font-weight: 700;
        padding: 1px 5px;
        border-radius: 3px;
        font-family: monospace;
        letter-spacing: 0.04em;
      }
      .tp-bash {
        background: #3a2a00;
        color: var(--yellow);
        border: 1px solid #d2992244;
      }
      .tp-read {
        background: #0e2040;
        color: #79c0ff;
        border: 1px solid #79c0ff44;
      }
      .tp-edit {
        background: #1a3a28;
        color: var(--green);
        border: 1px solid #3fb95044;
      }
      .tp-write {
        background: #1a3a28;
        color: var(--green);
        border: 1px solid #3fb95044;
      }
      .tp-grep {
        background: #0e2040;
        color: #79c0ff;
        border: 1px solid #79c0ff44;
      }
      .tp-glob {
        background: #0e2040;
        color: #79c0ff;
        border: 1px solid #79c0ff44;
      }
      .tp-web {
        background: #2a1a3a;
        color: var(--purple);
        border: 1px solid #bc8cff44;
      }
      .tp-agent {
        background: #3a1a00;
        color: var(--orange);
        border: 1px solid #f0883e44;
      }
      .tp-other {
        background: var(--surface);
        color: var(--muted);
        border: 1px solid var(--border);
      }
      .tc-sum-time {
        color: var(--yellow);
      }
      .tc-sum-size {
        color: #79c0ff;
      }
      .tc-sum-err {
        color: var(--red);
        font-weight: 700;
      }
      .tc-sum-sep {
        color: var(--faint);
      }

      .tc-list {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .tc-list.hidden {
        display: none;
      }

      /* 汇总面板 */
      .tc-stats-panel {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        padding: 6px 10px;
        margin-bottom: 6px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 4px;
        font-size: 12px;
      }
      .ts-item {
        display: flex;
        flex-direction: column;
        gap: 1px;
        min-width: 48px;
        justify-content: center;
        align-items: center;
      }
      .ts-label {
        color: var(--faint);
        letter-spacing: 0.05em;
        text-transform: uppercase;
        font-size: 12px;
      }
      .ts-val {
        color: var(--text);
        font-weight: 700;
        font-family: monospace;
      }
      .ts-val.ok {
        color: var(--green);
      }
      .ts-val.err {
        color: var(--red);
      }
      .ts-val.time {
        color: var(--yellow);
      }
      .ts-val.size {
        color: #79c0ff;
      }

      /* 单条工具卡片 */
      .tc-card {
        background: #0a0e14;
        border: 1px solid var(--border);
        border-radius: 4px;
        overflow: hidden;
        font-size: 12px;
      }
      .tc-head {
        display: flex;
        align-items: stretch;
      }
      .tc-band {
        width: 3px;
        flex-shrink: 0;
      }
      .bash .tc-band {
        background: var(--yellow);
      }
      .read .tc-band {
        background: #79c0ff;
      }
      .edit .tc-band {
        background: var(--green);
      }
      .write .tc-band {
        background: var(--green);
      }
      .grep .tc-band {
        background: #79c0ff;
      }
      .glob .tc-band {
        background: #79c0ff;
      }
      .web .tc-band {
        background: var(--purple);
      }
      .agent .tc-band {
        background: var(--orange);
      }
      .other .tc-band {
        background: var(--muted);
      }

      .tc-head-inner {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 10px;
        min-width: 0;
      }
      .tc-name {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
        flex-shrink: 0;
      }
      .bash .tc-name {
        color: var(--yellow);
      }
      .read .tc-name {
        color: #79c0ff;
      }
      .edit .tc-name {
        color: var(--green);
      }
      .write .tc-name {
        color: var(--green);
      }
      .grep .tc-name {
        color: #79c0ff;
      }
      .glob .tc-name {
        color: #79c0ff;
      }
      .web .tc-name {
        color: var(--purple);
      }
      .agent .tc-name {
        color: var(--orange);
      }
      .other .tc-name {
        color: var(--muted);
      }

      .tc-params-summary {
        flex: 1;
        min-width: 0;
        font-size: 12px;
        color: var(--muted);
        font-family: monospace;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tc-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }
      .tc-dur {
        font-size: 12px;
        color: var(--faint);
        font-family: monospace;
        min-width: 44px;
        text-align: right;
      }
      .tc-size {
        font-size: 12px;
        color: var(--faint);
        font-family: monospace;
        min-width: 40px;
        text-align: right;
      }
      .tc-st {
        font-size: 10px;
        font-weight: 700;
        padding: 2px 6px;
        border-radius: 3px;
        letter-spacing: 0.05em;
      }
      .tc-st.ok {
        background: #1a3a28;
        color: var(--green);
        border: 1px solid #3fb95044;
      }
      .tc-st.err {
        background: #2a1a1a;
        color: var(--red);
        border: 1px solid #f8514944;
      }

      /* 展开按钮 */
      .tc-expand-row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 3px 10px 3px 13px;
        border-top: 1px solid var(--border);
        font-size: 12px;
        color: var(--faint);
        cursor: pointer;
        user-select: none;
      }
      .tc-expand-row:hover {
        color: var(--blue);
        background: #161b2266;
      }

      /* 卡片详情体 */
      .tc-detail-wrap {
        display: none;
        border-top: 1px solid var(--border);
      }
      .tc-detail-wrap.open {
        display: block;
      }
      .tc-detail-body {
        padding: 7px 10px 7px 13px;
      }

      .tc-section-label {
        font-size: 12px;
        color: var(--faint);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 4px;
      }
      .tc-param-row {
        display: flex;
        align-items: baseline;
        gap: 6px;
        font-size: 12px;
        margin-bottom: 2px;
      }
      .tc-pk {
        color: var(--blue);
        flex-shrink: 0;
        min-width: 76px;

      /* ── 加载状态 ── */

      .chart-loading {

        font-size: 11px;

        padding: 6px 0 2px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .load-status .spinner {
        width: 10px;
        height: 10px;
        border: 1.5px solid #30363d;
        border-top-color: #58a6ff;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        flex-shrink: 0;
      }
      @keyframes spin {

          transform: rotate(360deg);
        }

      .load-error {
        padding: 32px 0;
        text-align: center;
        color: var(--red);
        font-size: 12px;
        line-height: 1.8;
      }
      .load-error .err-title {
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 6px;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <!-- ── STICKY 图表区 ── -->
    <div class="sticky-chart" id="stickyChart">
      <div class="dim-bar">
        <span class="dim-label">DIMS</span>
        <span class="dim-chip input" onclick="toggleDim('input', this)"><span class="dot"></span>input_tokens</span>
        <span class="dim-chip output" onclick="toggleDim('output', this)"><span class="dot"></span>output_tokens</span>
        <span class="dim-chip cache-r" onclick="toggleDim('cacheR', this)"><span class="dot"></span>cache_read</span>
        <span class="dim-chip cache-c" onclick="toggleDim('cacheC', this)"
          ><span class="dot"></span>cache_creation</span
        >
      </div>

      <div class="session-bar">
        <div class="session-select">▼ Apr 6 16:03 · crystalline-tumbling-summit</div>
        <div class="session-meta">
          <div class="smeta"><span class="smeta-l">in </span><span class="smeta-v in" id="tot-in">—</span></div>
          <div class="smeta"><span class="smeta-l">out </span><span class="smeta-v out" id="tot-out">—</span></div>
          <div class="smeta"><span class="smeta-l">cache_r </span><span class="smeta-v cr" id="tot-cr">—</span></div>
          <div class="smeta"><span class="smeta-l">cache_c </span><span class="smeta-v cc" id="tot-cc">—</span></div>
          <div class="smeta">
            <span class="smeta-l">turns </span><span class="smeta-v" id="tot-turns" style="color: var(--text)">—</span>
          </div>
        </div>
      </div>

      <div class="chart-header">
        <span class="chart-title-text">Pre Request TOKEN</span>
        <span class="range-label" id="rangeLabel">—</span>
      </div>
      <div id="chartLoadingPlaceholder" class="chart-loading skeleton"></div>
      <div class="main-chart-scroll" id="mainChartScroll" style="display: none">
        <canvas id="mainChart"></canvas>
      </div>

      <div class="brush-wrap" id="brushWrap">
        <div class="brush-title">RANGE SELECTOR</div>
        <canvas id="brushChart"></canvas>
        <div class="brush-overlay" id="brushOverlay">
          <div class="brush-selection" id="brushSel"></div>
          <div class="brush-handle" id="handleL" onmousedown="startDrag(event, 'L')" style="left: 0"></div>
          <div class="brush-handle" id="handleR" onmousedown="startDrag(event, 'R')" style="left: 100%"></div>
          <div
            class="brush-move-area"
            id="brushMove"
            onmousedown="startDrag(event, 'M')"
            style="left: 0; width: 100%"
          ></div>
        </div>
      </div>

      <div class="chart-legend">
        <div class="legend-item">
          <div class="legend-dot" style="background: var(--blue-dim)"></div>
          <span style="color: var(--blue)">input</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background: var(--green)"></div>
          <span style="color: var(--green)">output</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background: var(--yellow)"></div>
          <span style="color: var(--yellow)">cache_read</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background: var(--purple)"></div>
          <span style="color: var(--purple)">cache_creation</span>
        </div>
        <span style="margin-left: auto; font-size: 12px; color: var(--faint)">悬停对话高亮柱子 · 点击柱子跳转对话</span>
      </div>
    </div>

    <!-- ── 对话内容区 ── -->
    <div class="conv-scroll">
      <div class="section-label">Chat History</div>
      <div id="loadStatus" class="load-status" style="display: none">
        <div class="spinner"></div>
        <span id="loadStatusText">正在加载会话列表…</span>
      </div>
      <div id="convList"></div>
    </div>

    <script>
      // ═══════════════════════════════════════
      //  数据定义（包含 compact、branch 事件）
      // ═══════════════════════════════════════
      const DATA = [];

      // 只提取 turn 类型用于图表（动态，由 loadSession 填充）
      const TURNS = [];
      let N = 0;

      // ═══════════════════════════════════════
      //  状态
      // ═══════════════════════════════════════
      const dims = {input: true, output: true, cacheR: true, cacheC: true};
      const COLORS = {input: '#1f6feb', output: '#3fb950', cacheR: '#d29922', cacheC: '#bc8cff'};
      let brushL = 0,
        brushR = 1;
      let hoveredId = null; // 悬停的 turn id
      const DPR = window.devicePixelRatio || 1;

      // ═══════════════════════════════════════
      //  工具
      // ═══════════════════════════════════════
      function fmt(n) {
        return n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n || 0);
      }
      function fmtF(n) {
        return (n || 0).toLocaleString();
      }
      function escHtml(s) {
        return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }
      function getSegs(d) {
        const s = [];
        if (dims.input && d.input) s.push({key: 'input', val: d.input, col: COLORS.input});
        if (dims.output && d.output) s.push({key: 'output', val: d.output, col: COLORS.output});
        if (dims.cacheR && d.cacheR) s.push({key: 'cacheR', val: d.cacheR, col: COLORS.cacheR});
        if (dims.cacheC && d.cacheC) s.push({key: 'cacheC', val: d.cacheC, col: COLORS.cacheC});
        return s;
      }
      function setupCanvas(canvas, w, h) {
        canvas.width = w * DPR;
        canvas.height = h * DPR;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        const ctx = canvas.getContext('2d');
        ctx.scale(DPR, DPR);
        return ctx;
      }

      // ═══════════════════════════════════════
      //  图表绘制
      // ═══════════════════════════════════════
      let barRects = []; // [{id, x, y, w, h}] for hit testing

      // 每柱最小槽宽（px），决定图表是否需要横向滚动
      const MIN_BAR_SLOT = 14;

      function drawMainChart() {
        if (N === 0) return;
        const canvas = document.getElementById('mainChart');
        const W = canvas.parentElement.clientWidth - 2;
        const H = 120;
        const ctx = setupCanvas(canvas, W, H);

        const lo = Math.round(brushL * (N - 1));
        const hi = Math.round(brushR * (N - 1));
        const vis = TURNS.slice(lo, hi + 1);
        const M = vis.length;

        const PL = 36, // 左侧留 y 轴标签空间
          PR = 8,
          PT = 12,
          PB = 20; // 底部留时间轴空间
        const plotW = W - PL - PR,
          plotH = H - PT - PB;

        let maxT = 0;
        vis.forEach((d) => {
          const t =
            (dims.input ? d.input : 0) +
            (dims.output ? d.output : 0) +
            (dims.cacheR ? d.cacheR : 0) +
            (dims.cacheC ? d.cacheC : 0);
          if (t > maxT) maxT = t;
        });
        if (!maxT) maxT = 1;

        // grid + y 轴标签
        ctx.strokeStyle = '#21262d';
        ctx.lineWidth = 0.5;
        for (let i = 0; i <= 3; i++) {
          const y = PT + plotH - (i / 3) * plotH;
          ctx.beginPath();
          ctx.moveTo(PL, y);
          ctx.lineTo(W - PR, y);
          ctx.stroke();
          ctx.fillStyle = '#484f58';
          ctx.font = '9px monospace';
          ctx.textAlign = 'right';
          ctx.fillText(fmt((maxT * i) / 3), PL - 3, y + 3);
        }

        barRects = [];
        const barW = Math.min(28, (plotW / M) * 0.65);
        const gap = plotW / M;

        vis.forEach((d, i) => {
          const cx = PL + gap * (i + 0.5);
          const segs = getSegs(d);
          const total = segs.reduce((s, x) => s + x.val, 0);
          const barH = (total / maxT) * plotH;
          const isHov = hoveredId === d.id;

          if (isHov) {
            ctx.save();
            ctx.shadowColor = 'rgba(88,166,255,0.9)';
            ctx.shadowBlur = 5;
          }

          // 高亮时柱子加宽 2px
          const bW = isHov ? barW + 2 : barW;

          let y = PT + plotH;
          segs.forEach((seg) => {
            const sh = (seg.val / total) * barH;
            ctx.fillStyle = isHov ? seg.col + 'ff' : seg.col + (dims.input ? 'cc' : '66');
            ctx.fillRect(cx - bW / 2, y - sh, bW, sh);
            y -= sh;
          });

          if (isHov) ctx.restore();

          barRects.push({id: d.id, x: cx - barW / 2, y: PT + plotH - barH, w: barW, h: barH});
        });

        // ── 时间轴 ──
        // 根据 M（可见柱数）自适应刻度密度：约每 80~120px 一个刻度
        const targetTickPx = 100;
        const rawStep = Math.ceil(M / (plotW / targetTickPx));
        // 取 nice 步长（1/2/5/10/20/50/100...）
        const magnitude = Math.pow(10, Math.floor(Math.log10(rawStep)));
        let step = magnitude;
        for (const f of [1, 2, 5, 10]) {
          if (magnitude * f >= rawStep) {
            step = magnitude * f;
            break;
          }
        }
        if (step < 1) step = 1;

        // 判断时间格式精度
        const firstTs = vis[0]?.timestamp;
        const lastTs = vis[vis.length - 1]?.timestamp;
        let timeFmt = 'HH:MM';
        if (firstTs && lastTs) {
          const spanMs = new Date(lastTs) - new Date(firstTs);
          if (spanMs < 60000) timeFmt = 'HH:MM:SS';
          else if (spanMs > 86400000) timeFmt = 'MM-DD HH:MM';
        }

        function fmtTs(ts) {
          if (!ts) return '';
          const d = new Date(ts);
          const hh = String(d.getHours()).padStart(2, '0');
          const mm = String(d.getMinutes()).padStart(2, '0');
          const ss = String(d.getSeconds()).padStart(2, '0');
          const mo = String(d.getMonth() + 1).padStart(2, '0');
          const dd = String(d.getDate()).padStart(2, '0');
          if (timeFmt === 'HH:MM:SS') return `${hh}:${mm}:${ss}`;
          if (timeFmt === 'MM-DD HH:MM') return `${mo}-${dd} ${hh}:${mm}`;
          return `${hh}:${mm}`;
        }

        ctx.fillStyle = '#484f58';
        ctx.font = '9px monospace';
        ctx.textAlign = 'center';

        // 刻度线
        ctx.strokeStyle = '#30363d';
        ctx.lineWidth = 0.5;

        for (let i = 0; i < M; i += step) {
          const d = vis[i];
          const cx = PL + gap * (i + 0.5);
          // 刻度短线
          ctx.beginPath();
          ctx.moveTo(cx, PT + plotH);
          ctx.lineTo(cx, PT + plotH + 3);
          ctx.stroke();
          // 时间标签
          ctx.fillText(fmtTs(d.timestamp), cx, H - 3);
        }
        // 始终显示最后一个刻度（如果离上一个够远）
        const lastCx = PL + gap * (M - 0.5);
        const prevTickCx = PL + gap * (Math.floor((M - 1) / step) * step + 0.5);
        if (lastCx - prevTickCx > 40) {
          ctx.fillText(fmtTs(vis[M - 1]?.timestamp), lastCx, H - 3);
        }

        // 更新汇总
        let tIn = 0,
          tOut = 0,
          tCR = 0,
          tCC = 0;
        vis.forEach((d) => {
          tIn += d.input;
          tOut += d.output;
          tCR += d.cacheR;
          tCC += d.cacheC;
        });
        document.getElementById('tot-in').textContent = fmt(tIn);
        document.getElementById('tot-out').textContent = fmt(tOut);
        document.getElementById('tot-cr').textContent = fmt(tCR);
        document.getElementById('tot-cc').textContent = fmt(tCC);
        document.getElementById('tot-turns').textContent = vis.length;
        document.getElementById('rangeLabel').textContent = `Request #${vis[0].id} – #${vis[vis.length - 1].id}`;
      }

      function drawBrushChart() {
        if (N === 0) return;
        const canvas = document.getElementById('brushChart');
        const W = canvas.parentElement.clientWidth - 2;
        const H = 32;
        const ctx = setupCanvas(canvas, W, H);

        let maxT = 0;
        TURNS.forEach((d) => {
          const t = d.input + d.output + d.cacheR + d.cacheC;
          if (t > maxT) maxT = t;
        });
        const barW = Math.max(2, (W / N) * 0.6);
        const gap = W / N;
        TURNS.forEach((d, i) => {
          const cx = gap * (i + 0.5);
          const segs = getSegs(d);
          const total = segs.reduce((s, x) => s + x.val, 0);
          const bH = (total / maxT) * (H - 2);
          let y = H;
          segs.forEach((seg) => {
            const sh = (seg.val / total) * bH;
            ctx.fillStyle = seg.col + '77';
            ctx.fillRect(cx - barW / 2, y - sh, barW, sh);
            y -= sh;
          });
        });
        updateBrushOverlay(W);
      }

      function updateBrushOverlay(W) {
        if (!W) {
          const c = document.getElementById('brushChart');
          W = c.parentElement.clientWidth - 2;
        }
        const ov = document.getElementById('brushOverlay');
        ov.style.width = W + 'px';
        ov.style.left = '0';
        const lx = brushL * W,
          rx = brushR * W;
        document.getElementById('brushSel').style.cssText = `left:${lx}px;width:${rx - lx}px`;
        document.getElementById('handleL').style.left = lx + 'px';
        document.getElementById('handleR').style.left = rx + 'px';
        document.getElementById('brushMove').style.cssText = `left:${lx}px;width:${rx - lx}px`;
      }

      // ═══════════════════════════════════════
      //  主图点击 → 跳转对话
      // ═══════════════════════════════════════
      document.getElementById('mainChart').addEventListener('click', (e) => {
        if (mainDragMoved) return; // 拖拽结束后不触发点击
        const rect = e.target.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        for (const br of barRects) {
          if (mx >= br.x && mx <= br.x + br.w && my >= br.y && my <= br.y + br.h) {
            const el = document.getElementById('turn-' + br.id);
            if (el) {
              const idx = TURNS.findIndex((t) => t.id === br.id);
              scrollToTurnIndex(idx);
            }
            break;
          }
        }
      });
      // 鼠标移动在主图上 → highlight bar（此处不做 hover，hover 来自对话行）
      document.getElementById('mainChart').addEventListener('mousemove', (e) => {
        const rect = e.target.getBoundingClientRect();
        const mx = e.clientX - rect.left,
          my = e.clientY - rect.top;
        let found = null;
        for (const br of barRects) {
          if (mx >= br.x && mx <= br.x + br.w && my >= br.y && my <= br.y + br.h) {
            found = br.id;
            break;
          }
        }
        if (found !== hoveredId) {
          hoveredId = found;
          document.getElementById('mainChart').style.cursor = found ? 'pointer' : 'default';
          drawMainChart();
          // 高亮对话行
          document.querySelectorAll('.conv-turn').forEach((el) => {
            el.classList.toggle('bar-hover', el.dataset.turnId == found);
          });
        }
      });
      document.getElementById('mainChart').addEventListener('mouseleave', () => {
        if (hoveredId) {
          hoveredId = null;
          drawMainChart();
        }
        document.querySelectorAll('.conv-turn').forEach((el) => el.classList.remove('bar-hover'));
      });

      // ═══════════════════════════════════════
      //  Brush 拖拽
      // ═══════════════════════════════════════
      let drag = null,
        dragX = 0,
        dragL = 0,
        dragR = 0,
        dragMoved = false;
      function startDrag(e, type) {
        e.preventDefault();
        e.stopPropagation(); // 防止冒泡到 brushChart click
        drag = type;
        dragMoved = false;
        dragX = e.clientX;
        dragL = brushL;
        dragR = brushR;
        window.addEventListener('mousemove', onDrag);
        window.addEventListener('mouseup', stopDrag);
      }
      function onDrag(e) {
        if (!drag) return;
        const W = document.getElementById('brushChart').parentElement.clientWidth - 2;
        const dx = (e.clientX - dragX) / W;
        if (Math.abs(e.clientX - dragX) > 2) dragMoved = true;
        const minS = 1 / Math.max(N, 1);
        if (drag === 'L') brushL = Math.max(0, Math.min(dragL + dx, brushR - minS));
        else if (drag === 'R') brushR = Math.min(1, Math.max(dragR + dx, brushL + minS));
        else {
          // 整体平移，保持 span
          const sp = dragR - dragL;
          brushL = Math.max(0, Math.min(dragL + dx, 1 - sp));
          brushR = brushL + sp;
        }
        updateBrushOverlay(W);
        drawMainChart();
        scrollToTurnIndex(Math.round(brushL * (N - 1)));
      }
      function stopDrag() {
        drag = null;
        window.removeEventListener('mousemove', onDrag);
        window.removeEventListener('mouseup', stopDrag);
      }

      // ═══════════════════════════════════════
      //  主图拖拽平移（移动 brush 窗口，不改变窗口宽度）
      // ═══════════════════════════════════════
      let mainDrag = false,
        mainDragX = 0,
        mainDragL = 0,
        mainDragR = 0,
        mainDragMoved = false;

      document.getElementById('mainChart').addEventListener('mousedown', (e) => {
        mainDrag = true;
        mainDragMoved = false;
        mainDragX = e.clientX;
        mainDragL = brushL;
        mainDragR = brushR;
        document.getElementById('mainChart').classList.add('dragging');
        window.addEventListener('mousemove', onMainDrag);
        window.addEventListener('mouseup', stopMainDrag);
      });

      function onMainDrag(e) {
        if (!mainDrag) return;
        const dx = e.clientX - mainDragX;
        if (Math.abs(dx) > 3) mainDragMoved = true;
        if (!mainDragMoved) return;
        const W = document.getElementById('mainChart').clientWidth;
        const span = mainDragR - mainDragL;
        // 向右拖 → 视口向左移（看更早的数据），向左拖 → 看更晚的
        const offset = -(dx / W) * span;
        const newL = Math.max(0, Math.min(mainDragL + offset, 1 - span));
        brushL = newL;
        brushR = newL + span;
        updateBrushOverlay();
        drawMainChart();
        scrollToTurnIndex(Math.round(brushL * (N - 1)));
      }

      function stopMainDrag() {
        mainDrag = false;
        document.getElementById('mainChart').classList.remove('dragging');
        window.removeEventListener('mousemove', onMainDrag);
        window.removeEventListener('mouseup', stopMainDrag);
      }

      // ═══════════════════════════════════════
      //  维度切换
      // ═══════════════════════════════════════
      function toggleDim(key, el) {
        dims[key] = !dims[key];
        el.classList.toggle('off', !dims[key]);
        drawMainChart();
        drawBrushChart();
        // 维度切换只需重绘图表，不重建列表
      }

      // ── 抑制 scroll→brush 更新的标志（避免 brush 跳转时死循环）
      let _suppressScrollObserver = false;
      let _suppressScrollTimer = null;
      let _visibleTurnIds = {};
      let _scrollObserver = null;

      // 滚动到指定 turn index 并临时抑制 observer
      // suppress 持续到滚动真正停止后 100ms，避免固定 timeout 不可靠
      function scrollToTurnIndex(idx) {
        const t = TURNS[Math.max(0, Math.min(idx, TURNS.length - 1))];
        if (!t) return;
        const el = document.getElementById('turn-' + t.id);
        if (!el) return;
        const stickyH = document.getElementById('stickyChart')?.offsetHeight || 0;
        const top = el.getBoundingClientRect().top + window.scrollY - stickyH - 8;
        _suppressScrollObserver = true;
        clearTimeout(_suppressScrollTimer);
        // 用 scroll 事件检测滚动停止，停止后 120ms 才恢复 observer
        const onScroll = () => {
          clearTimeout(_suppressScrollTimer);
          _suppressScrollTimer = setTimeout(() => {
            _suppressScrollObserver = false;
            window.removeEventListener('scroll', onScroll, {passive: true});
          }, 120);
        };
        window.addEventListener('scroll', onScroll, {passive: true});
        // 兜底：最多抑制 2s（针对极短距离不触发 scroll 事件的情况）
        _suppressScrollTimer = setTimeout(() => {
          _suppressScrollObserver = false;
          window.removeEventListener('scroll', onScroll, {passive: true});
        }, 2000);
        window.scrollTo({top, behavior: 'smooth'});
      }

      // 将 ratio 移动到指定中心，保持当前 span 不变
      function moveBrushCenter(centerRatio) {
        const span = brushR - brushL;
        let newL = centerRatio - span / 2;
        newL = Math.max(0, Math.min(newL, 1 - span));
        brushL = newL;
        brushR = newL + span;
      }

      // brush bar 点击：以点击位置为中心，保持 span 不变
      document.getElementById('brushChart').addEventListener('click', (e) => {
        if (N === 0) return;
        const rect = e.target.getBoundingClientRect();
        const ratio = (e.clientX - rect.left) / rect.width;
        moveBrushCenter(ratio);
        updateBrushOverlay();
        drawBrushChart();
        drawMainChart();
        scrollToTurnIndex(Math.round(brushL * (N - 1)));
      });

      // 根据滚动位置计算当前视口内可见的 turn index 范围
      function getVisibleTurnRange() {
        const stickyH = document.getElementById('stickyChart')?.offsetHeight || 0;
        const viewTop = window.scrollY + stickyH;
        const viewBottom = window.scrollY + window.innerHeight;
        let loIdx = -1,
          hiIdx = -1;
        for (let i = 0; i < TURNS.length; i++) {
          const el = document.getElementById('turn-' + TURNS[i].id);
          if (!el) continue;
          const top = el.offsetTop;
          const bottom = top + el.offsetHeight;
          // 元素与视口有交叉
          if (bottom > viewTop && top < viewBottom) {
            if (loIdx < 0) loIdx = i;
            hiIdx = i;
          }
        }
        return {loIdx, hiIdx};
      }

      // scroll 事件 → 更新 brush（保持 span 不变）
      function onPageScroll() {
        if (_suppressScrollObserver) return;
        if (N === 0) return;
        const {loIdx, hiIdx} = getVisibleTurnRange();
        if (loIdx < 0) return;
        const centerRatio = (loIdx + hiIdx) / 2 / Math.max(N - 1, 1);
        moveBrushCenter(centerRatio);
        updateBrushOverlay();
        drawBrushChart();
        drawMainChart();
      }

      // setupScrollObserver 改为注册 scroll 事件（只注册一次）
      let _scrollListenerRegistered = false;
      function setupScrollObserver() {
        if (_scrollListenerRegistered) return null;
        _scrollListenerRegistered = true;
        window.addEventListener('scroll', onPageScroll, {passive: true});
        return {disconnect: () => {}}; // 保持接口兼容
      }

      // ═══════════════════════════════════════
      //  对话列表渲染
      // ═══════════════════════════════════════
      function updateConvList() {
        const allIds = new Set(TURNS.map((t) => t.id));
        const list = document.getElementById('convList');
        list.innerHTML = '';

        // 渲染全部数据
        DATA.forEach((item) => {
          if (item.type === 'turn') {
            list.appendChild(renderTurn(item));
          } else if (item.type === 'compact') {
            list.appendChild(renderCompact(item));
          } else if (item.type === 'branch') {
            list.appendChild(renderBranch(item, allIds));
          }
        });

        // 确保 scroll 监听已注册（只注册一次）
        setupScrollObserver();
      }

      let _uid = 0;
      function uid() {
        return ++_uid;
      }

      function renderTurn(d) {
        const wrap = document.createElement('div');
        wrap.id = 'turn-' + d.id;
        wrap.setAttribute('data-turn-id', d.id);

        const addHover = (el) => {
          el.addEventListener('mouseenter', () => {
            hoveredId = d.id;
            drawMainChart();
            document
              .querySelectorAll(`.conv-turn[data-turn-id="${d.id}"]`)
              .forEach((x) => x.classList.add('bar-hover'));
          });
          el.addEventListener('mouseleave', () => {
            hoveredId = null;
            drawMainChart();
            document.querySelectorAll('.conv-turn').forEach((x) => x.classList.remove('bar-hover'));
          });
        };

        const tokHtml = buildTokHtml(d);
        const scBadge = d.sidechain ? `<span class="sidechain-badge">SIDECHAIN</span>` : '';
        const hasUser = (d.user || '').trim().length > 0;

        // ── USER 行（仅当有用户输入时渲染） ──
        if (hasUser) {
          const userDiv = document.createElement('div');
          userDiv.className = 'msg-user conv-turn';
          userDiv.setAttribute('data-turn-id', d.id);
          if (d.sidechain) userDiv.style.borderColor = '#f8514933';

          const uLines = Math.ceil((d.user || '').length / 60) + (d.user || '').split('\n').length;
          const needFoldU = uLines > 7;
          userDiv.innerHTML = `
    <div class="msg-user-header">
      <span class="role-badge user">USER</span>
      ${scBadge}
      <span class="msg-time">${d.time}</span>
      <div class="msg-tokens">${tokHtml}</div>
    </div>
    <div class="msg-body">
      <div class="msg-text${needFoldU ? ' clamped' : ''}" id="ut-${d.id}">${escHtml(d.user)}</div>
      ${needFoldU ? `<span class="expand-btn" id="ueb-${d.id}" onclick="toggleExp('ut-${d.id}','ueb-${d.id}')">▼ 展开全部</span>` : ''}
    </div>`;
          addHover(userDiv);
          wrap.appendChild(userDiv);
        }

        // ── ASSISTANT 行 ──
        const aDiv = document.createElement('div');
        // 无 user 输入时用 asst-led 样式（ASSISTANT 主导）
        aDiv.className = (hasUser ? 'msg-assistant' : 'msg-asst-led') + ' conv-turn';
        aDiv.setAttribute('data-turn-id', d.id);

        const aLines = Math.ceil((d.assistant || '').length / 60) + (d.assistant || '').split('\n').length;
        const needFoldA = aLines > 6;
        // 无 user 时把 token 统计放在 assistant header
        const aHeaderTok = hasUser ? '' : `<div class="msg-tokens" style="margin-left:auto">${tokHtml}</div>`;
        aDiv.innerHTML = `
    <div class="msg-assistant-header">
      <span class="role-badge asst">ASSISTANT</span>
      ${!hasUser ? scBadge : ''}
      <span class="msg-time">${d.time}</span>
      <span class="model-tag">${d.model || ''}</span>
      ${aHeaderTok}
    </div>`;

        // thinking block（若有）
        if (d.thinking) {
          const tid = `th-${d.id}`;
          const thBlock = document.createElement('div');
          thBlock.className = 'thinking-block';
          thBlock.innerHTML = `
      <div class="thinking-header" onclick="toggleThink('${tid}',this)">
        <span class="thinking-icon">🧠</span>
        <span>内部推理过程</span>
        <span style="font-size: 12px;color:var(--faint);margin-left:4px;">${Math.ceil(d.thinking.length / 4)} tokens (est.)</span>
        <span class="thinking-toggle">▶ 展开</span>
      </div>
      <div class="thinking-body" id="${tid}">${escHtml(d.thinking)}</div>`;
          aDiv.appendChild(thBlock);
        }

        // assistant 文字
        const aBody = document.createElement('div');
        aBody.className = 'msg-body';
        aBody.innerHTML = `
    <div class="msg-text${needFoldA ? ' clamped' : ''}" id="at-${d.id}">${escHtml(d.assistant)}</div>
    ${needFoldA ? `<span class="expand-btn" id="aeb-${d.id}" onclick="toggleExp('at-${d.id}','aeb-${d.id}')">▼ 展开全部</span>` : ''}`;
        aDiv.appendChild(aBody);
        addHover(aDiv);

        // ── 工具调用组（若有） ──
        wrap.appendChild(aDiv);
        if (d.tools && d.tools.length > 0) {
          wrap.appendChild(renderToolGroup(d));
        }
        return wrap;
      }

      function renderToolGroup(d) {
        const tools = d.tools;
        const tcId = `tc-${d.id}`;
        const listId = `tcl-${d.id}`;

        // 汇总数据
        const total = tools.length;
        const errCount = tools.filter((t) => t.isErr).length;
        const okCount = total - errCount;
        const totalMs = tools.reduce((s, t) => s + parseDur(t.dur), 0);
        const totalBytes = tools.reduce((s, t) => s + parseSize(t.retSize), 0);
        const slowest = tools.reduce((a, b) => (parseDur(a.dur) >= parseDur(b.dur) ? a : b));
        const biggest = tools
          .filter((t) => parseSize(t.retSize) > 0)
          .reduce((a, b) => (parseSize(a.retSize) >= parseSize(b.retSize) ? a : b), tools[0]);

        // 工具 pill 汇总
        const counts = {};
        tools.forEach((t) => {
          counts[t.cls] = (counts[t.cls] || 0) + 1;
        });
        const pillsHtml = Object.entries(counts)
          .map(([cls, n]) => `<span class="tool-pill tp-${cls}">${cls.toUpperCase()}×${n}</span>`)
          .join('');

        const grp = document.createElement('div');
        grp.className = 'tc-group';
        grp.innerHTML = `
    <div class="tc-toggle" id="${tcId}" onclick="toggleTcGroup('${listId}','${tcId}')">
      <span class="arrow">▶</span>
      <span class="tc-badge">${total} 次工具调用</span>
      <span class="tc-summary">
        <span class="tool-pills">${pillsHtml}</span>
        <span class="tc-sum-sep">·</span>
        <span class="tc-sum-time">${fmtDur(totalMs)}</span>
        <span class="tc-sum-sep">·</span>
        <span class="tc-sum-size">${fmtBytes(totalBytes)}</span>
        ${errCount ? `<span class="tc-sum-sep">·</span><span class="tc-sum-err">${errCount} ERR</span>` : ''}
      </span>
    </div>`;

        const list = document.createElement('div');
        list.className = 'tc-list hidden';
        list.id = listId;

        // 汇总面板
        const statsPanel = document.createElement('div');
        statsPanel.className = 'tc-stats-panel';
        statsPanel.innerHTML = `
    <div class="ts-item"><div class="ts-label">总调用</div><div class="ts-val">${total}</div></div>
    <div class="ts-item"><div class="ts-label">成功</div><div class="ts-val ok">${okCount}</div></div>
    <div class="ts-item"><div class="ts-label">失败</div><div class="ts-val ${errCount ? 'err' : 'ok'}">${errCount}</div></div>
    <div class="ts-item"><div class="ts-label">总耗时</div><div class="ts-val time">${fmtDur(totalMs)}</div></div>
    <div class="ts-item"><div class="ts-label">最慢</div><div class="ts-val time">${slowest.name} ${slowest.dur}</div></div>
    <div class="ts-item"><div class="ts-label">返回总量</div><div class="ts-val size">${fmtBytes(totalBytes)}</div></div>
    <div class="ts-item"><div class="ts-label">最大返回</div><div class="ts-val size">${biggest.name} ${biggest.retSize}</div></div>`;
        list.appendChild(statsPanel);

        // 每条工具卡片
        tools.forEach((t, i) => {
          const detailId = `tcd-${d.id}-${i}`;
          const paramsHtml = (t.input || [])
            .map(
              (p) =>
                `<div class="tc-param-row"><span class="tc-pk">${p.k}</span><span class="tc-pv ${p.vc || ''}">${escHtml(p.v)}</span></div>`,
            )
            .join('');

          const card = document.createElement('div');
          card.className = `tc-card ${t.cls}`;
          card.innerHTML = `
      <div class="tc-head">
        <div class="tc-band"></div>
        <div class="tc-head-inner">
          <span class="tc-name">${t.name}</span>
          <span class="tc-params-summary">${escHtml(t.params)}</span>
          <div class="tc-meta">
            <span class="tc-dur">${t.dur}</span>
            <span class="tc-size">${t.retSize}</span>
            <span class="tc-st ${t.status}">${t.status.toUpperCase()}</span>
          </div>
        </div>
      </div>
      <div class="tc-expand-row" onclick="toggleTcDetail('${detailId}',this)">
        <span class="arrow" style="font-size: 12px;transition:transform .15s;display:inline-block">▶</span>
        <span>展开参数与返回</span>
        ${t.retLines && t.retLines !== '—' ? `<span style="margin-left:auto;color:var(--faint)">${t.retLines}</span>` : ''}
      </div>
      <div class="tc-detail-wrap" id="${detailId}">
        <div class="tc-detail-body">
          ${paramsHtml ? `<div class="tc-section-label">INPUT</div>${paramsHtml}` : ''}
          <div class="tc-result-block">
            <div class="tc-result-meta">
              <span>OUTPUT</span>
              <span class="rm-bytes">${t.retSize}</span>
              ${t.retLines && t.retLines !== '—' ? `<span class="rm-lines">${t.retLines}</span>` : ''}
            </div>
            <div class="tc-result-preview${t.isErr ? ' is-err' : ''}">${escHtml(t.output || '(no output)')}</div>
          </div>
        </div>
      </div>`;
          list.appendChild(card);
        });

        grp.appendChild(list);
        return grp;
      }

      // 辅助：解析耗时字符串 → ms 数字
      function parseDur(s) {
        if (!s) return 0;
        return parseInt(s.replace(/,/g, '')) || 0;
      }
      // 辅助：解析大小字符串 → bytes
      function parseSize(s) {
        if (!s || s === '—') return 0;
        const m = s.match(/([\d.]+)\s*(KB|B)?/i);
        if (!m) return 0;
        return m[2] && m[2].toUpperCase() === 'KB' ? parseFloat(m[1]) * 1024 : parseFloat(m[1]);
      }
      function fmtDur(ms) {
        return ms >= 1000 ? (ms / 1000).toFixed(1) + 's' : ms + 'ms';
      }
      function fmtBytes(b) {
        return b >= 1024 ? (b / 1024).toFixed(1) + ' KB' : b.toFixed(0) + ' B';
      }

      function toggleTcGroup(listId, toggleId) {
        const list = document.getElementById(listId);
        const tog = document.getElementById(toggleId);
        const hidden = list.classList.toggle('hidden');
        tog.classList.toggle('open', !hidden);
      }

      function toggleTcDetail(detailId, row) {
        const wrap = document.getElementById(detailId);
        const open = wrap.classList.toggle('open');
        const arrow = row.querySelector('.arrow');
        if (arrow) arrow.style.transform = open ? 'rotate(90deg)' : 'rotate(0)';
      }

      function toggleThink(id, header) {
        const body = document.getElementById(id);
        const open = body.classList.toggle('open');
        header.querySelector('.thinking-toggle').textContent = open ? '▼ 收起' : '▶ 展开';
      }

      function buildTokHtml(d) {
        return [
          dims.input && d.input
            ? `<span class="tok in"><span class="tl">in </span><span class="tv">${fmtF(d.input)}</span></span>`
            : '',
          dims.output && d.output
            ? `<span class="tok out"><span class="tl">out </span><span class="tv">${fmtF(d.output)}</span></span>`
            : '',
          dims.cacheR && d.cacheR
            ? `<span class="tok cr"><span class="tl">cr </span><span class="tv">${fmtF(d.cacheR)}</span></span>`
            : '',
          dims.cacheC && d.cacheC
            ? `<span class="tok cc"><span class="tl">cc </span><span class="tv">${fmtF(d.cacheC)}</span></span>`
            : '',
        ]
          .filter(Boolean)
          .join('');
      }

      function renderCompact(item) {
        const div = document.createElement('div');
        div.className = 'event-compact';
        div.innerHTML = `
    <span class="ev-label">COMPACT</span>
    <span class="ev-detail">${escHtml(item.detail)}</span>
    <span class="ev-meta">${item.time} · 移除 ${fmt(item.removedTokens)} tokens，保留 ${fmt(item.retainedTokens)}</span>`;
        return div;
      }

      function renderBranch(item, inRangeIds) {
        const wrap = document.createElement('div');
        const header = document.createElement('div');
        header.className = 'branch-header';
        header.innerHTML = `
    <span class="branch-tag"><span class="dot"></span>${item.label}</span>
    <span class="branch-dim-label">${item.time} · ${escHtml(item.description)}</span>`;
        wrap.appendChild(header);

        const body = document.createElement('div');
        body.className = 'branch-body';
        (item.turns || [])
          .filter((t) => inRangeIds.has(t.id))
          .forEach((t) => {
            body.appendChild(renderTurn(t));
          });
        wrap.appendChild(body);
        return wrap;
      }

      function toggleExp(textId, btnId) {
        const el = document.getElementById(textId);
        const btn = document.getElementById(btnId);
        const folded = el.classList.toggle('clamped');
        btn.textContent = folded ? '▼ 展开全部' : '▲ 收起';
      }

      // ═══════════════════════════════════════
      //  动态数据加载 + SSE 实时更新
      // ═══════════════════════════════════════

      // 将 parser.js 输出的 session turn 结构适配为页面 DATA 格式
      function adaptSession(session) {
        if (!session || !session.turns) return [];
        return session.turns.map((t) => ({
          type: 'turn',
          id: t.id,
          time: t.time,
          user: t.userText || '',
          assistant: t.assistantText || '',
          model: t.model || '',
          input: t.input || 0,
          output: t.output || 0,
          cacheR: t.cacheR || 0,
          cacheC: t.cacheC || 0,
          isSidechain: t.isSidechain || false,
          thinking: t.thinking || null,
          tools: (t.tools || []).map((tool) => ({
            cls: tool.cls,
            name: tool.name,
            params: tool.params,
            status: tool.status,
            dur: tool.dur,
            retSize: tool.retSize,
            retLines: tool.retLines,
            input: tool.inputArgs || [],
            output: tool.retContent || '',
            isErr: tool.isErr,
          })),
        }));
      }

      function setLoadStatus(text) {
        const el = document.getElementById('loadStatus');
        const txt = document.getElementById('loadStatusText');
        if (!el) return;
        if (text) {
          el.style.display = 'flex';
          txt.textContent = text;
        } else {
          el.style.display = 'none';
        }
      }

      function showConvError(msg) {
        const list = document.getElementById('convList');
        list.innerHTML = `<div class="load-error"><div class="err-title">加载失败</div>${msg}</div>`;
      }

      function showConvSkeleton() {
        const rows = Array.from(
          {length: 6},
          (_, i) => `
          <div class="sk-row">
            <div class="skeleton sk-badge"></div>
            <div class="skeleton sk-line ${i % 3 === 0 ? 's' : i % 3 === 1 ? 'm' : ''}"></div>
          </div>`,
        ).join('');
        document.getElementById('convList').innerHTML = `<div class="init-state">${rows}</div>`;
      }

      async function loadSessions() {
        setLoadStatus('正在加载会话列表…');
        showConvSkeleton();
        try {
          const res = await fetch('/api/sessions');
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const list = await res.json();
          populateSessionSelector(list);
          if (list.length > 0) {
            await loadSession(list[0].sessionId);
          } else {
            setLoadStatus(null);
            showConvError('未找到任何会话记录。<br>请先使用 Claude Code 开始一次对话。');
          }
        } catch (e) {
          setLoadStatus(null);
          showConvError(`无法连接到 token-reporter 服务器。<br><code>${e.message}</code>`);
          console.error('Failed to load sessions', e);
        }
      }

      function populateSessionSelector(list) {
        const sel = document.querySelector('.session-select');
        if (!sel) return;
        // 重建为真实 <select>
        const select = document.createElement('select');
        select.className = 'session-select';
        select.style.cssText =
          'background:#161b22;border:1px solid #21262d;border-radius:5px;padding:5px 12px;color:#58a6ff;font-size:11px;cursor:pointer;font-family:inherit;';
        list.forEach((s) => {
          const opt = document.createElement('option');
          opt.value = s.sessionId;
          opt.textContent = `${s.mtime.slice(0, 10)} ${s.mtime.slice(11, 16)} · ${s.slug}`;
          select.appendChild(opt);
        });
        select.onchange = () => loadSession(select.value);
        sel.replaceWith(select);
      }

      async function loadSession(sessionId, {preserveScroll = false} = {}) {
        if (!preserveScroll) {
          setLoadStatus('正在解析会话数据…');
          showConvSkeleton();
        }
        try {
          const res = await fetch('/api/sessions/' + sessionId);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const session = await res.json();
          // 保存当前滚动位置（SSE 刷新时使用）
          const savedScrollY = preserveScroll ? window.scrollY : 0;
          DATA.length = 0;
          DATA.push(...adaptSession(session));
          TURNS.length = 0;
          TURNS.push(
            ...DATA.flatMap((d) => {
              if (d.type === 'turn') return [d];
              if (d.type === 'branch') return d.turns || [];
              return [];
            }),
          );
          N = TURNS.length;
          if (!preserveScroll) {
            // 主动切换会话：重置到头部，初始窗口约 20 条或 25%，取较小值
            brushL = 0;
            const initSpan = N > 0 ? Math.min(0.25, 20 / N) : 1;
            brushR = Math.min(1, initSpan);
          }
          // 显示图表区，隐藏 skeleton 占位
          const _placeholder = document.getElementById('chartLoadingPlaceholder');
          const _chartScroll = document.getElementById('mainChartScroll');
          if (_placeholder) _placeholder.style.display = 'none';
          if (_chartScroll) _chartScroll.style.display = '';
          setLoadStatus(null);
          drawBrushChart();
          drawMainChart();
          updateConvList();
          // SSE 刷新后恢复滚动位置，抑制 observer 避免 brush 跳回
          if (preserveScroll && savedScrollY > 0) {
            _suppressScrollObserver = true;
            clearTimeout(_suppressScrollTimer);
            requestAnimationFrame(() => {
              window.scrollTo({top: savedScrollY, behavior: 'instant'});
              _suppressScrollTimer = setTimeout(() => {
                _suppressScrollObserver = false;
              }, 300);
            });
          }
        } catch (e) {
          if (!preserveScroll) {
            setLoadStatus(null);
            showConvError(`会话数据加载失败。<br><code>${e.message}</code>`);
          }
          console.error('Failed to load session', e);
        }
      }

      // SSE 实时更新
      function connectSSE() {
        const es = new EventSource('/events');
        es.onmessage = async (e) => {
          try {
            const msg = JSON.parse(e.data);
            if (msg.type === 'update' || msg.type === 'tool_use') {
              // 重新加载当前会话
              const sel = document.querySelector('select.session-select');
              if (sel) await loadSession(sel.value, {preserveScroll: true});
            }
          } catch {}
        };
        es.onerror = () => setTimeout(connectSSE, 3000);
      }

      function init() {
        // 立即显示加载中状态
        setLoadStatus('正在加载会话列表…');
        showConvSkeleton();
        connectSSE();
        loadSessions();
      }
      window.addEventListener('load', init);
      window.addEventListener('resize', () => {
        drawBrushChart();
        drawMainChart();
      });
    </script>
  </body>
</html>
