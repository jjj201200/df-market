<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Token Report</title>
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/chart.css" />
    <link rel="stylesheet" href="/css/messages.css" />
    <link rel="stylesheet" href="/css/tools.css" />
    <link rel="stylesheet" href="/css/ui.css" />
  </head>
  <body>
    <!-- ── STICKY CHART AREA ── -->
    <div class="sticky-chart" id="stickyChart">
      <div class="dim-bar">
        <span class="dim-label">DIMS</span>
        <span class="dim-chip input" onclick="toggleDim('input', this)"
          ><span class="dot"></span>input_tokens</span
        >
        <span class="dim-chip output" onclick="toggleDim('output', this)"
          ><span class="dot"></span>output_tokens</span
        >
        <span class="dim-chip cache-r" onclick="toggleDim('cacheR', this)"
          ><span class="dot"></span>cache_read</span
        >
        <span class="dim-chip cache-c" onclick="toggleDim('cacheC', this)"
          ><span class="dot"></span>cache_creation</span
        >
      </div>

      <div class="session-bar">
        <div class="session-select">
          ▼ Apr 6 16:03 · crystalline-tumbling-summit
        </div>
        <div class="session-meta">
          <div class="smeta">
            <span class="smeta-l">in </span
            ><span class="smeta-v in" id="tot-in">—</span>
          </div>
          <div class="smeta">
            <span class="smeta-l">out </span
            ><span class="smeta-v out" id="tot-out">—</span>
          </div>
          <div class="smeta">
            <span class="smeta-l">cache_r </span
            ><span class="smeta-v cr" id="tot-cr">—</span>
          </div>
          <div class="smeta">
            <span class="smeta-l">cache_c </span
            ><span class="smeta-v cc" id="tot-cc">—</span>
          </div>
          <div class="smeta">
            <span class="smeta-l">turns </span
            ><span class="smeta-v" id="tot-turns" style="color: var(--text)"
              >—</span
            >
          </div>
        </div>
      </div>

      <div class="chart-header">
        <span class="chart-title-text">Pre Request TOKEN</span>
        <span class="range-label" id="rangeLabel">—</span>
      </div>
      <div id="chartLoadingPlaceholder" class="chart-loading skeleton"></div>
      <div class="main-chart-scroll" id="mainChartScroll" style="display: none">
        <canvas id="mainChart"></canvas>
      </div>

      <div class="brush-wrap" id="brushWrap">
        <!-- <div class="brush-title">RANGE SELECTOR</div> -->
        <canvas id="brushChart"></canvas>
        <div class="brush-overlay" id="brushOverlay">
          <div class="brush-selection" id="brushSel"></div>
          <div
            class="brush-handle"
            id="handleL"
            onmousedown="startDrag(event, 'L')"
            style="left: 0"
          ></div>
          <div
            class="brush-handle"
            id="handleR"
            onmousedown="startDrag(event, 'R')"
            style="left: 100%"
          ></div>
          <div
            class="brush-move-area"
            id="brushMove"
            onmousedown="startDrag(event, 'M')"
            style="left: 0; width: 100%"
          ></div>
        </div>
      </div>

      <div class="chart-legend">
        <div class="legend-item">
          <div class="legend-dot" style="background: var(--blue-dim)"></div>
          <span style="color: var(--blue)">input</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background: var(--green)"></div>
          <span style="color: var(--green)">output</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background: var(--yellow)"></div>
          <span style="color: var(--yellow)">cache_read</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background: var(--purple)"></div>
          <span style="color: var(--purple)">cache_creation</span>
        </div>
        <span style="margin-left: auto; font-size: 12px; color: var(--faint)"
          >Hover to highlight bar · Click bar to jump to turn</span
        >
      </div>

      <!-- ── LIMITS DISPLAY ── -->
      <div id="limitsDisplay" class="limits-display"></div>
    </div>

    <!-- ── CONVERSATION CONTENT AREA ── -->
    <div class="conv-scroll">
      <div class="section-label sticky-label">Chat History</div>
      <div id="loadStatus" class="load-status" style="display: none">
        <div class="spinner"></div>
        <span id="loadStatusText">Loading session list…</span>
      </div>
      <div id="convList"></div>
    </div>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
